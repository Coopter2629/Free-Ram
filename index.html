<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No scam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* FIXED: Removed double hashtag */
            background-color: #2d3d3d; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .center-container {
            position: relative;
            z-index: 10;
        }
        
        /* FIXED: Added text-decoration: none to make the link look like a clean button */
        .target-button {
            display: inline-block;
            text-decoration: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .target-button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        .arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 40px 0 40px 80px;
            border-color: transparent transparent transparent #ff0000;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
        }

        .arrow-left {
            left: 17%;
            top: 50%;
            transform: translateY(-50%);
        }

        .arrow-top {
            top: 15%;
            left: 50%;
            transform: translateX(-50%) rotate(90deg);
        }

        .arrow-right {
            right: 15%;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="arrow arrow-left"></div>
    <div class="arrow arrow-top"></div>
    <div class="arrow arrow-right"></div>

    <div class="center-container">
        <!-- FIXED: Swapped <button> out for an <a> tag so the link functions -->
        <a href="./Open for free ram.zip" download class="target-button">Free Ram Here</a>
    </div>

</body>
</html>
